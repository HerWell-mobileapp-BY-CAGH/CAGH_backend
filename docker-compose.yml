services:
  db:
    image: postgres:16-alpine
    container_name: cagh_postgres_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cagh_db}
      POSTGRES_USER: ${POSTGRES_USER:-cagh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cagh_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cagh_user} -d ${POSTGRES_DB:-cagh_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cagh_redis
    ports:
      - "6379:6379"

  web:
    build: .
    image: cagh_backend:latest
    container_name: cagh_django_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - POSTGRES_DB=${POSTGRES_DB:-cagh_db}
      - POSTGRES_USER=${POSTGRES_USER:-cagh_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cagh_secure_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-cagh_user}:${POSTGRES_PASSWORD:-cagh_secure_password}@db:5432/${POSTGRES_DB:-cagh_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build: .
    image: cagh_backend:latest
    container_name: cagh_celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cagh_db}
      - POSTGRES_USER=${POSTGRES_USER:-cagh_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cagh_secure_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-cagh_user}:${POSTGRES_PASSWORD:-cagh_secure_password}@db:5432/${POSTGRES_DB:-cagh_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
